# PrompTune 전체 스택
# db(healthy) → ai-service/backend → frontend

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: promptune
      POSTGRES_USER: promptune
      POSTGRES_PASSWORD: promptune
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptune"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build: ./ai-service
    environment:
      USE_REAL_MODELS: "false"
      USE_REAL_DIAGNOSIS: "${USE_REAL_DIAGNOSIS:-false}"
      AI_DIAGNOSIS_MODEL_PATH: /app/models/prompt-diagnosis
      AI_DIAGNOSIS_MAX_LENGTH: "256"
      AI_DIAGNOSIS_DEVICE: "cpu"
      USE_REAL_SPELLCHECK: "${USE_REAL_SPELLCHECK:-false}"
      BAREUN_API_KEY: "${BAREUN_API_KEY:-}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      BAREUN_API_URL: "${BAREUN_API_URL:-https://api.bareun.ai}"
      USE_REAL_SUGGESTION: "${USE_REAL_SUGGESTION:-false}"
      USE_REAL_IMPROVEMENT: "${USE_REAL_IMPROVEMENT:-false}"
      USE_REAL_GENERATION: "${USE_REAL_GENERATION:-false}"
      USE_REAL_TITLE_SUMMARY: "${USE_REAL_TITLE_SUMMARY:-false}"
      USE_REAL_RETRIEVAL: "${USE_REAL_RETRIEVAL:-true}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HCX_MODEL: "${HF_HCX_MODEL:-naver-hyperclovax/HyperCLOVAX-SEED-Vision-Instruct-3B}"
      HF_HCX_DEVICE: "${HF_HCX_DEVICE:-auto}"
      HF_HCX_DTYPE: "${HF_HCX_DTYPE:-auto}"
      HF_HOME: /root/.cache/huggingface
      BGE_M3_MODEL: "${BGE_M3_MODEL:-BAAI/bge-m3}"
      BGE_M3_DEVICE: "${BGE_M3_DEVICE:-auto}"
      BGE_M3_USE_FP16: "${BGE_M3_USE_FP16:-auto}"
      BGE_M3_BATCH_SIZE: "${BGE_M3_BATCH_SIZE:-4}"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: promptune
      DB_USER: promptune
      DB_PASSWORD: promptune
    volumes:
      - ./ai-service/models/prompt-diagnosis:/app/models/prompt-diagnosis:ro
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'')"',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/promptune
      SPRING_DATASOURCE_USERNAME: promptune
      SPRING_DATASOURCE_PASSWORD: promptune
      AI_SERVICE_URL: http://ai-service:8000
      APP_FRONTEND_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-client-secret}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-dummy-client-id}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-dummy-client-secret}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-dummy-client-id}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-dummy-client-secret}
      JWT_SECRET: ${JWT_SECRET:-promptune-dev-secret-key-change-in-production-please}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8080/api/integrations/microsoft/callback}
      MICROSOFT_FRONTEND_URL: ${MICROSOFT_FRONTEND_URL:-http://localhost:3000}
      MICROSOFT_TOKEN_KEY: ${MICROSOFT_TOKEN_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  hf_cache:
