name: CI

# 언제 실행되나: main 푸시 + 모든 PR
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- AI 서비스 (FastAPI) ----------
  ai-service:
    name: AI Service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: import·기동 검증
        run: python -c "from app.main import app; print('FastAPI app OK')"
      - name: 엔드포인트 스모크 테스트
        run: |
          pip install httpx
          python -c "
          from fastapi.testclient import TestClient
          from app.main import app

          c = TestClient(app)

          health = c.get('/health')
          assert health.status_code == 200
          assert health.json()['status'] == 'ok'

          validate = c.post(
              '/api/ai/validate',
              json={
                  'original': '핵심 내용을 3개 항목으로 정리해줘',
                  'generated': '- 첫째\n- 둘째\n- 셋째'
              }
          )
          assert validate.status_code == 200
          assert validate.json()['passed'] is True

          print('AI 스모크 테스트 통과')
          "

  # ---------- 백엔드 (Spring Boot) ----------
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4
      - name: 컴파일 검증
        run: gradle compileJava --no-daemon

  # ---------- 프론트 (Next.js) ----------
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 의존성 설치
        run: npm install
      - name: 타입 체크
        run: npx tsc --noEmit
      - name: 빌드
        run: npm run build

  # ---------- Docker Compose 통합 검증 ----------
  docker-build:
    name: Docker 빌드 검증
    runs-on: ubuntu-latest
    needs: [ai-service, backend, frontend] # 위 3개 통과 후에만
    steps:
      - uses: actions/checkout@v4
      - name: compose 파일 문법 검증
        run: docker compose config
      - name: 이미지 빌드 (기동 없이 빌드만)
        run: docker compose build

  # ---------- ECR 배포 (main 머지 시에만) ----------
  # AWS_ROLE_ARN이 GitHub Secrets에 아직 등록되지 않았다면 이 job은 스킵됩니다.
  # 실제 AWS 계정/IAM Role 설정 후 Settings > Secrets and variables > Actions 에
  # AWS_ROLE_ARN 을 등록하면 자동으로 동작합니다.
  push-to-ecr:
    name: ECR 이미지 푸시
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_ECR_PUSH == 'true'
    permissions:
      id-token: write # OIDC로 임시 자격증명 발급받기 위해 필요
      contents: read
    env:
      AWS_REGION: ap-northeast-2
      # TODO: 실제 ECR 저장소 이름과 다르면 여기 세 값만 바꾸면 됩니다.
      ECR_REPO_BACKEND: promptune-backend
      ECR_REPO_FRONTEND: promptune-frontend
      ECR_REPO_AI: promptune-ai-service
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 설정 (OIDC, 장기 액세스키 없음)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드 & 태깅
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPO_BACKEND:$IMAGE_TAG -t $REGISTRY/$ECR_REPO_BACKEND:latest ./backend
          docker build -t $REGISTRY/$ECR_REPO_FRONTEND:$IMAGE_TAG -t $REGISTRY/$ECR_REPO_FRONTEND:latest ./frontend
          docker build -t $REGISTRY/$ECR_REPO_AI:$IMAGE_TAG -t $REGISTRY/$ECR_REPO_AI:latest ./ai-service

      - name: ECR로 푸시
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $REGISTRY/$ECR_REPO_BACKEND:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPO_BACKEND:latest
          docker push $REGISTRY/$ECR_REPO_FRONTEND:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPO_FRONTEND:latest
          docker push $REGISTRY/$ECR_REPO_AI:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPO_AI:latest
