name: Deploy to EC2

# main 브랜치에 push(= PR 머지)될 때마다 자동 배포
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼도 생김

# 배포가 겹쳐서 꼬이는 것 방지 (동시에 두 번 실행 안 되게)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH로 EC2에 접속해서 배포 스크립트 실행 (실패 시 자동 롤백)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -uo pipefail
            cd ${{ secrets.EC2_DEPLOY_PATH }}

            PREV_COMMIT=$(git rev-parse HEAD)
            echo "롤백 대상(현재) 커밋: $PREV_COMMIT"

            deploy_ok=true
            git fetch origin main || deploy_ok=false
            git reset --hard origin/main || deploy_ok=false
            ./scripts/fetch-secrets.sh || deploy_ok=false
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build || deploy_ok=false

            if [ "$deploy_ok" = "true" ]; then
              # 2026-08-25: backend/frontend가 재생성되면 새 컨테이너가 새 IP를 받는데,
              # nginx는 이미지가 안 바뀌면 up -d --build로도 재시작이 안 돼서 계속 떠있던
              # 채로 남고, 업스트림 IP를 시작 시점에 한 번만 resolve해서 캐싱해둔 채라
              # 계속 예전(죽은) 컨테이너로 연결을 시도함 — 그 결과 502가 나서 바로 아래
              # 헬스체크가 실패로 오판하고, 정상적으로 배포된 빌드인데도 롤백되는 사고가
              # 날 수 있음 (2026-08-25, 수동 재배포 때 실제로 재현되어 원인 확인됨).
              # backend/frontend 재기동 직후 nginx를 명시적으로 재시작해서 업스트림 IP를
              # 새로 잡게 한다.
              docker compose -f docker-compose.prod.yml --env-file .env.production restart nginx || deploy_ok=false
            fi

            if [ "$deploy_ok" = "true" ]; then
              echo "빌드/재시작 성공, 헬스체크 시작"
              healthy=false
              # ai-service/backend/frontend를 한 번에 재기동하면 (특히 Spring Boot
              # 콜드스타트) 30초로는 부족해서 정상 배포도 헬스체크 오탐으로 롤백되는
              # 경우가 있었음 (2026-08-24) — 재시도 횟수/간격을 늘림.
              for i in $(seq 1 18); do
                sleep 10
                # 2026-08-24: Elastic IP(3.38.254.149)를 붙이면서 도메인이 바뀜.
                # (처음 붙이려던 52.79.49.225는 원인 불명의 권한 오류로 실패해서,
                # 새로 발급한 3.38.254.149로 대신 연결함)
                # 이전엔 EC2 퍼블릭 IP가 고정이 아니어서(EIP 미연결) 재시작마다
                # 바뀔 수 있었는데, 지금은 EIP라서 앞으로는 고정됨.
                if curl -fsS --max-time 5 -o /dev/null https://3-38-254-149.nip.io/; then
                  healthy=true
                  break
                fi
                echo "헬스체크 재시도 ($i/18)..."
              done
              if [ "$healthy" != "true" ]; then
                echo "헬스체크 실패 (사이트가 응답하지 않음)"
                deploy_ok=false
              fi
            fi

            if [ "$deploy_ok" != "true" ]; then
              echo "배포 실패 감지 — 이전 커밋($PREV_COMMIT)으로 롤백합니다"
              git reset --hard "$PREV_COMMIT"
              docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
              docker compose -f docker-compose.prod.yml --env-file .env.production restart nginx
              docker image prune -f
              # 2026-08-25: docker image prune -f는 dangling 이미지만 지우고 build
              # cache(BuildKit)는 안 건드림. 배포마다 조금씩 쌓이다가 결국 루트 디스크가
              # 100% 꽉 차서 git/시크릿/빌드 단계가 전부 "No space left on device"로
              # 연쇄 실패하고, 롤백조차 같은 이유로 실패해 .env.production까지 사라지는
              # 사고가 실제로 있었음 (2026-08-25). 매 배포(성공/실패 모두) 끝에 정리한다.
              docker builder prune -af
              echo "롤백 완료. 이번 배포는 실패로 처리합니다."
              exit 1
            fi

            docker image prune -f
            # 위 롤백 분기와 동일한 이유로 성공 경로에도 build cache 정리를 추가.
            docker builder prune -af
            echo "배포 성공"
