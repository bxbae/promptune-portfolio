# PrompTune 배포용 (EC2 + RDS)
# 로컬 db 없음 → AWS RDS 연결
# 실행: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  ai-service:
    # 2026-08-25: 프로덕션이 t3.large에서 g4dn.xlarge(GPU) 인스턴스로 옮겨감에 따라
    # ai-service도 GPU를 실제로 쓰도록 전환. 이전엔 dockerfile 지정이 없어서 CPU 전용
    # Dockerfile로 빌드됐고, GPU 인스턴스 위에서 떠도 컨테이너에 GPU가 전혀 전달되지
    # 않아(디바이스 예약 설정 자체가 없었음) 실질적으로 CPU로 추론하고 있었다 —
    # /usr/local의 CUDA 툴킷(수십 GB)만 낭비되고 정작 서비스는 GPU를 못 쓰던 상태.
    # docker-compose.gpu.yml(GPU 단독 벤치마크용)에서 검증된 설정을 반영한다.
    build:
      context: ./ai-service
      dockerfile: Dockerfile.gpu
    # docker compose(스웜 아님)에서도 Compose v2.3+ / NVIDIA Container Toolkit이
    # 설치돼 있으면 이 reservations 블록으로 GPU를 컨테이너에 붙일 수 있다
    # (g4dn.xlarge에서 nvidia-ctk 설정 후 실측 확인됨 — docker-compose.gpu.yml과 동일).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      USE_REAL_MODELS: "${USE_REAL_MODELS:-false}"
      USE_REAL_DIAGNOSIS: "${USE_REAL_DIAGNOSIS:-false}"
      AI_DIAGNOSIS_MODEL_PATH: /app/models/prompt-diagnosis
      AI_DIAGNOSIS_MAX_LENGTH: "256"
      AI_DIAGNOSIS_DEVICE: "cpu"
      USE_REAL_SPELLCHECK: "${USE_REAL_SPELLCHECK:-false}"
      BAREUN_API_KEY: "${BAREUN_API_KEY:-}"
      USE_REAL_SUGGESTION: "${USE_REAL_SUGGESTION:-false}"
      # 2026-08-25: retrieval-execute의 웹검색(external_or_realtime) 라우트에서 사용.
      # 이 줄이 없으면 .env.production에 TAVILY_API_KEY를 채워도 컨테이너 안으로
      # 전달되지 않아서(docker compose는 environment에 명시된 변수만 주입함)
      # [Retrieval] execute failed: TAVILY_API_KEY가 없습니다 가 계속 재현됨.
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      # 2026-08-24: 승득님이 올린 real HyperCLOVA X 생성(generate_hcx.py)을 켜기 위해 추가.
      # USE_REAL_GENERATION이 컨테이너 환경에 아예 없으면 코드가 USE_REAL_MODELS로 폴백하는데,
      # USE_REAL_MODELS를 통째로 true로 켜면 진단(KcELECTRA)/추천(suggest_hcx, 내부적으로
      # BGE-M3까지 무조건 로드함)까지 같이 켜져 버려서 위험함 — 생성만 별도로 켤 수 있게
      # 명시적으로 선언.
      USE_REAL_GENERATION: "${USE_REAL_GENERATION:-false}"
      # 내부 문서/첨부파일은 mock으로 폴백하면 잘못된 답을 만들 수 있으므로
      # 배포 환경에서는 기본적으로 실제 BGE-M3 + pgvector retrieval을 사용한다.
      USE_REAL_RETRIEVAL: "${USE_REAL_RETRIEVAL:-true}"
      USE_REAL_VALIDATION: "${USE_REAL_VALIDATION:-false}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HCX_MODEL: "${HF_HCX_MODEL:-naver-hyperclovax/HyperCLOVAX-SEED-Vision-Instruct-3B}"
      # 기본값은 CPU로 유지하고, GPU 배포에서는 .env.production의
      # HF_HCX_DEVICE=cuda로 명시적으로 활성화한다.
      HF_HCX_DEVICE: "${HF_HCX_DEVICE:-cpu}"
      HF_HCX_DTYPE: "${HF_HCX_DTYPE:-auto}"
      HF_HOME: /root/.cache/huggingface
      BGE_M3_MODEL: "${BGE_M3_MODEL:-BAAI/bge-m3}"
      BGE_M3_DEVICE: "${BGE_M3_DEVICE:-auto}"
      BGE_M3_USE_FP16: "${BGE_M3_USE_FP16:-auto}"
      BGE_M3_BATCH_SIZE: "${BGE_M3_BATCH_SIZE:-4}"
      # AI-service가 pgvector/RDS를 직접 조회하므로 Spring의 JDBC URL과 별개로
      # psycopg용 DB_* 환경변수도 컨테이너에 반드시 전달해야 한다.
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - ./ai-service/models/prompt-diagnosis:/app/models/prompt-diagnosis:ro
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
      AI_SERVICE_URL: http://ai-service:8000
      APP_FRONTEND_URL: "${APP_FRONTEND_URL}"
      APP_CORS_ORIGINS: "${APP_CORS_ORIGINS}"
      JWT_SECRET: "${JWT_SECRET}"
      OAUTH_REDIRECT_BASE: "${OAUTH_REDIRECT_BASE}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      KAKAO_CLIENT_ID: "${KAKAO_CLIENT_ID:-}"
      KAKAO_CLIENT_SECRET: "${KAKAO_CLIENT_SECRET:-}"
      NAVER_CLIENT_ID: "${NAVER_CLIENT_ID:-}"
      NAVER_CLIENT_SECRET: "${NAVER_CLIENT_SECRET:-}"
      MICROSOFT_CLIENT_ID: "${MICROSOFT_CLIENT_ID:-}"
      MICROSOFT_CLIENT_SECRET: "${MICROSOFT_CLIENT_SECRET:-}"
      MICROSOFT_TENANT: "${MICROSOFT_TENANT:-common}"
      MICROSOFT_REDIRECT_URI: "${MICROSOFT_REDIRECT_URI:-}"
      MICROSOFT_FRONTEND_URL: "${MICROSOFT_FRONTEND_URL:-}"
      MICROSOFT_TOKEN_KEY: "${MICROSOFT_TOKEN_KEY:-}"
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
      AWS_S3_DOCUMENTS_BUCKET: "${AWS_S3_DOCUMENTS_BUCKET:-promptune-document}"
    ports:
      - "8080:8080"
    depends_on:
      - ai-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # Nginx 리버스 프록시 + HTTPS(Let's Encrypt) 종료. 최초 인증서 발급은
  # scripts/init-letsencrypt.sh 로 한 번 해줘야 함 (docs/EC2_배포_가이드.md 5-2절 참고).
  nginx:
    image: nginx:1.27-alpine
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # 12시간마다 인증서 만료 임박 여부 체크 후 자동 갱신 (webroot 방식이라 nginx 무중단).
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;"
    restart: unless-stopped

  # 장애/다운 알림 + 상태 대시보드 (로그·상태 모니터링 P1). 팀 내부 운영용 도구라 nginx/HTTPS를
  # 새로 안 붙이고, 포트(3001)를 보안그룹에서 우리 IP만 허용하는 방식으로 접근 제한한다
  # (SSH 22번과 동일한 방식 — docs/EC2_배포_가이드.md 9절 참고).
  # docker.sock을 읽기전용으로 마운트해서 컨테이너 자체가 죽었는지도 감지할 수 있게 함.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    volumes:
      - uptime_kuma_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  hf_cache:
  uptime_kuma_data:
